[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^(?P<version>\d+(?:\.\d+)*(?:[\.\+\w]+)?)$'
result = "{version}" 

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "aare"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]
license = "MPL-2.0 AND Apache-2.0 AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
license-files = ["LICENSES/*", "THIRD-PARTY-NOTICES.txt"]



[tool.cibuildwheel.linux]
build = "cp{312,313,314}-manylinux_x86_64"

[tool.cibuildwheel.macos]
build = "cp{312,313,314}-macosx_*"
archs = ["arm64"]

[tool.cibuildwheel.windows]
build = "cp{312,313,314}-win_amd64"


[tool.scikit-build]
build.verbose = true
# A fixed build directory keeps the absolute paths of the compiled sources
# stable between runs, which sccache needs for a cache hit
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
install.components = ["python"]

[tool.scikit-build.cmake.define]
AARE_PYTHON_BINDINGS = "ON"
AARE_INSTALL_PYTHONEXT = "ON"


[tool.pytest.ini_options]
markers = [
    "files: marks tests that need additional data (deselect with '-m \"not files\"')",
]